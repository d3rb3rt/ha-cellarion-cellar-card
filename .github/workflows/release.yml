name: Release

# Creates a GitHub release (and its tag) when the version in manifest.json changes on main.
# Notes: docs/release-notes/<tag>.md if present, else the commit subjects since the previous tag.
# Changing the notes file of the current version on main updates the existing release.
# Notes files of earlier versions (docs/release-notes/vX.Y.Z.md) update the release of that tag too, if it exists.
on:
  push:
    branches: [main]
    paths:
      - custom_components/cellarion_cellar_card/manifest.json
      - docs/release-notes/*.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v="v$(jq -r .version custom_components/cellarion_cellar_card/manifest.json)"
          file="docs/release-notes/$v.md"
          prev="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$v" | head -n 1 || true)"
          notes="$(mktemp)"
          if [ -f "$file" ]; then
            cp "$file" "$notes"
          else
            git log "${prev:+$prev..}HEAD" --no-merges --format='%s' \
              | grep -viE '^(release |merge |synced )|not visible' \
              | awk '!seen[$0]++' | sed 's/^/- /' > "$notes" || true
          fi
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$v" >> "$notes"
          fi
          if gh release view "$v" >/dev/null 2>&1; then
            if [ -f "$file" ]; then
              gh release edit "$v" --notes-file "$notes"
            else
              echo "$v already released"
            fi
          else
            gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file "$notes"
          fi
      - name: Update the notes of earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cur="v$(jq -r .version custom_components/cellarion_cellar_card/manifest.json)"
          for file in docs/release-notes/v*.md; do
            [ -f "$file" ] || continue
            v="$(basename "$file" .md)"
            [ "$v" = "$cur" ] && continue
            gh release view "$v" >/dev/null 2>&1 || continue
            prev="$(git tag --list 'v*' --sort=v:refname | awk -v t="$v" '$0==t{print p; exit} {p=$0}')"
            notes="$(mktemp)"
            cp "$file" "$notes"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$v" >> "$notes"
            fi
            gh release edit "$v" --notes-file "$notes"
          done
