# Labels and descriptions live in strings.json; this file defines structure and selectors.
read:
refresh:
sync:
  fields:
    max_age:
      default: 300
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
bottle:
  fields:
    id:
      required: true
      selector:
        text:
settings:
  fields:
    filter_order:
      required: true
      selector:
        object:
    filter_hidden:
      required: true
      selector:
        object:
    language:
      selector:
        text:
    rack_settings:
      selector:
        object:
    keep_state:
      selector:
        boolean:
producer_sort:
  fields:
    name:
      required: true
      selector:
        text:
    index:
      required: true
      selector:
        number:
          min: -1
          max: 20
consume_bottle:
  fields:
    bottle_id:
      required: true
      selector:
        text:
    reason:
      default: drank
      selector:
        select:
          options: [drank, gifted, sold, other]
    rating:
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    note:
      selector:
        text:
          multiline: true
